    <!-- Contact Section -->

    <section class="skills">

        <h2>Contact Me</h2>


        <div class="contact-form">

            <form onsubmit="sendMessage(event)">

                <input
                    type="text"
                    id="name"
                    placeholder="Your Name"
                    required
                >


                <input
                    type="email"
                    id="email"
                    placeholder="Your Email"
                    required
                >


                <textarea
                    id="message"
                    placeholder="Write your message..."
                    rows="6"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="btn"
                >
                    Send Message
                </button>

            </form>

        </div>


        <div class="contact-info">

            <h3>Get In Touch</h3>

            <p>
                Email: zubayer@example.com
            </p>

            <p>
                Location: Bangladesh
            </p>

        </div>

    </section>
